services:
  uk-public-data-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      MCP_TRANSPORT: http
      PORT: 3000
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      COMPANIES_HOUSE_BASE_URL: ${COMPANIES_HOUSE_BASE_URL:-https://api.company-information.service.gov.uk}
      ODS_BASE_URL: ${ODS_BASE_URL:-https://directory.spineservices.nhs.uk/ORD/2-0-0/organisations}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-10000}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-3}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      COMPANIES_HOUSE_RATE_LIMIT_REQUESTS: ${COMPANIES_HOUSE_RATE_LIMIT_REQUESTS:-30}
      POLICE_RATE_LIMIT_REQUESTS: ${POLICE_RATE_LIMIT_REQUESTS:-30}
      UPSTREAM_CONCURRENCY: ${UPSTREAM_CONCURRENCY:-4}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      POSTCODES_CACHE_TTL_MS: ${POSTCODES_CACHE_TTL_MS:-86400000}
      COMPANIES_HOUSE_CACHE_TTL_MS: ${COMPANIES_HOUSE_CACHE_TTL_MS:-900000}
      ODS_CACHE_TTL_MS: ${ODS_CACHE_TTL_MS:-86400000}
      POLICE_CACHE_TTL_MS: ${POLICE_CACHE_TTL_MS:-300000}
      BANK_HOLIDAYS_CACHE_TTL_MS: ${BANK_HOLIDAYS_CACHE_TTL_MS:-43200000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uk-public-data-mcp.rule=Host(`ukdatamcp.excelemma.site`)"
      - "traefik.http.services.uk-public-data-mcp.loadbalancer.server.port=3000"
    restart: unless-stopped

  uk-public-data-mcp-inspector:
    build:
      context: ./inspector-render
      dockerfile: Dockerfile
    environment:
      PORT: 10000
      MCP_PROXY_FULL_ADDRESS: https://inspector.excelemma.site
      MCP_PROXY_AUTH_TOKEN: ${INSPECTOR_TOKEN:?Set INSPECTOR_TOKEN in Coolify}
      DANGEROUSLY_OMIT_AUTH: "true"
      ALLOWED_MCP_TARGET: http://uk-public-data-mcp:3000
    depends_on:
      - uk-public-data-mcp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uk-public-data-mcp-inspector.rule=Host(`inspector.excelemma.site`)"
      - "traefik.http.services.uk-public-data-mcp-inspector.loadbalancer.server.port=10000"
    restart: unless-stopped
